<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#281914"><title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Noto+Naskh+Arabic:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div class="intro-screen" id="introScreen">
  <div class="intro-photo"></div><div class="intro-shade"></div>
  <div class="intro-content">
    <span class="botanical">❧</span>
    <div class="cover-names latin"><span id="coverBride"></span><i>&</i><span id="coverGroom"></span></div>
    <div class="envelope" id="envelope"><div class="flap"></div><div class="left"></div><div class="right"></div><div class="bottom"></div><button id="seal" class="seal" aria-label="فتح الدعوة"><span id="sealLetters"></span></button></div>
    <p>اضغط على الختم لفتح الدعوة</p>
  </div>
</div>

<main id="page">
<section class="panel hero snap">
 <img id="heroImg" class="cover-img" alt=""><div class="shade"></div>
 <button id="musicBtn" class="music-btn" aria-label="تشغيل أو إيقاف الموسيقى">♫</button>
 <div class="center reveal"><span class="botanical">❧</span><h1 class="latin names"><span id="bride"></span><i>&</i><span id="groom"></span></h1><p class="latin date" id="date"></p><p class="city" id="city"></p></div>
 <div class="scrollcue"><span>اكتشف الدعوة</span>⌄</div>
</section>

<section class="panel paper snap">
 <div class="reveal invitation-card"><span class="botanical dark">❧</span><h2 class="ruqaa">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</h2><p id="intro"></p><div class="latin signature"><span id="sigBride"></span> <i>&</i> <span id="sigGroom"></span></div></div>
 <div class="reveal"><div class="divider">✦</div><p class="welcome" id="welcome"></p><h2 class="ruqaa section-title">العد التنازلي للفرح</h2><div class="countdown"><div><b id="d"></b><small>يوم</small></div><div><b id="h"></b><small>ساعة</small></div><div><b id="m"></b><small>دقيقة</small></div><div><b id="s"></b><small>ثانية</small></div></div></div>
</section>

<section class="panel program snap">
 <div class="reveal"><div class="mini">❧</div><h2 class="ruqaa section-title">برنامج الحفل</h2><div id="timeline" class="timeline"></div></div>
</section>

<section class="panel venue snap">
 <img id="venueImg" class="cover-img parallax" alt=""><div class="shade venue-shade"></div>
 <div class="glass reveal"><span class="mini">✦</span><h2 class="ruqaa">مكان الحفل</h2><h3 class="latin" id="venue"></h3><p id="venueCity"></p><div class="fine-line"></div><p id="venueText"></p></div>
</section>

<section class="panel paper snap dress">
 <div class="reveal"><span class="mini">♙</span><h2 class="ruqaa section-title">إطلالة الحفل</h2><p id="dressText"></p><div id="palette" class="palette"></div></div>
 <figure class="reveal image-card"><img id="dinnerImg" alt="أجواء حفل الزفاف"></figure>
 <div class="reveal note"><span>♥</span><h2 class="ruqaa">ملاحظة بمحبة</h2><p id="note"></p></div>
</section>

<section class="panel finale snap">
 <img src="assets/hero.jpg" class="cover-img finale-img" alt=""><div class="shade final-shade"></div>
 <div class="center reveal"><span class="botanical">❧</span><p class="closing" id="closing"></p><div class="heart">♥</div><h2 class="latin final-names"><span id="finalBride"></span><i>&</i><span id="finalGroom"></span></h2><p class="latin date" id="finalDate"></p><span class="initials latin" id="initials"></span></div>
</section>
</main>
<audio id="audio" loop preload="auto"></audio>
<script src="config.js"></script><script src="script.js"></script>
</body></html>
